<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<link rel="stylesheet" type="text/css" href="css/bootstrap.min.3.3.6.css"/>
	<link rel="stylesheet" type="text/css" href="css/blocklino.css"/>
	<!-- MPR: Monitor Serie para los monitores (modo monitor, Ctrl + Mayús + M). Textos en español; lógica en term.js.
	     Sin gap en flex ni clamp(): la ventana corre en Chromium 69 (Electron 4). -->
	<style>
		#title { color: #2d2d64; }
		#mpr_term_estado { display: inline-block; margin-left: 10px; font-weight: normal; font-size: 13px; color: #2d2d64; }
		#mpr_term_estado.conectado { color: #1e8a2e; }
		#fenetre_term { white-space: pre-wrap; word-wrap: break-word; font-family: Consolas, "Courier New", monospace; font-size: 13px; line-height: 1.35; height: 395px; padding-top: 5px; }
		.mpr-term-pie { padding: 0 5px; }
		.mpr-term-pie .btn { margin-left: 4px; }
	</style>
</head>
<body style="overflow: hidden;">
	<div id="title-bar">
        <div id="title">
			<span class="fa fa-terminal fa-1_75x fa-fw"></span> Monitor Serie <span id="mpr_term_estado"></span>
		</div>
        <div id="title-bar-btns">
			<button id="btn_quit" type="button" class="btn btn-quitBlue" title="Cerrar (suelta el puerto)"><span class="fa fa-times fa-1_75x"></span></button>
        </div>
    </div>
	<div id="divfenetre">
		<div class="form-group" style="padding-left:5px;padding-right:5px;">
			<div class="input-group input-group-md icon-addon addon-md">
				<input type="text" placeholder="Escribe una orden para Otto y presiona Enter" name="" id="schbox" class="form-control" autocomplete="off" spellcheck="false">
				<span class="input-group-btn">
					<button id="btn_envoi" type="button" class="btn btn-info">Enviar</button>
				</span>
			</div>
		</div>
		<div id="fenetre_term"></div>
		<div class="row mpr-term-pie">
			<div class="col-xs-4">
				<select id="vitesse" class="form-control" title="Debe ser la misma velocidad de «Configuración del Monitor Serie» (9600 si el programa no la tiene)">
					<option value="300">300 baudios</option>
					<option value="600">600 baudios</option>
					<option value="1200">1200 baudios</option>
					<option value="2400">2400 baudios</option>
					<option value="4800">4800 baudios</option>
					<option value="9600" selected>9600 baudios</option>
					<option value="14400">14400 baudios</option>
					<option value="19200">19200 baudios</option>
					<option value="28800">28800 baudios</option>
					<option value="31250">31250 baudios</option>
					<option value="38400">38400 baudios</option>
					<option value="57600">57600 baudios</option>
					<option value="115200">115200 baudios</option>
				</select>
			</div>
			<div class="col-xs-8 text-right">
				<button id="btn_efface" type="button" class="btn btn-info" title="Borrar lo que se ve">
					<span class="fa fa-eraser"></span> Borrar
				</button>
				<button id="btn_csv" type="button" class="btn btn-info" title="Guardar lo recibido en un archivo (por ejemplo, para abrirlo en una planilla)">
					<span class="fa fa-floppy-o"></span> Guardar
				</button>
				<button id="btn_connect" type="button" class="btn btn-info">
					<span class="fa fa-play"></span> Conectar
				</button>
			</div>
		</div>
	</div>
</body>
<script>try { require('../resources/app/term.js') } catch (e) { if (e.code === 'MODULE_NOT_FOUND') require('../term.js'); else throw e }</script>
</html>
